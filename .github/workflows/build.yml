name: Verify and publish Windows portable

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-pet-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-portable:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source and assets
        run: npm run check

      - name: Build portable EXE
        run: npm run build:portable -- --publish never

      - name: Package portable ZIP and checksums
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $exeName = "Classic-Alice-$version-win-x64-portable.exe"
          $exe = Join-Path dist $exeName
          if (-not (Test-Path -LiteralPath $exe)) { throw "Missing portable EXE: $exe" }
          $zip = Join-Path dist "Classic-Alice-$version-win-x64-portable.zip"
          Compress-Archive -LiteralPath @($exe, '经典艾莉丝-使用说明.md', 'LICENSE') -DestinationPath $zip
          $hashes = @($exe, $zip) | ForEach-Object {
            $item = Get-Item -LiteralPath $_
            "{0}  {1}" -f (Get-FileHash -LiteralPath $item.FullName -Algorithm SHA256).Hash, $item.Name
          }
          $hashes | Set-Content -LiteralPath 'dist/SHA256SUMS.txt' -Encoding ascii

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: classic-alice-windows-x64
          path: |
            dist/Classic-Alice-*-win-x64-portable.exe
            dist/Classic-Alice-*-win-x64-portable.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish versioned release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $existing = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($existing -eq $env:GITHUB_SHA) {
              Write-Output "$tag already points to this commit."
              exit 0
            }
            throw "$tag belongs to another commit. Bump package.json and package-lock.json before publishing."
          }
          $notes = "docs/releases/$tag.md"
          if (-not (Test-Path -LiteralPath $notes)) { throw "Missing release notes: $notes" }
          gh release create $tag "dist/Classic-Alice-$version-win-x64-portable.exe" "dist/Classic-Alice-$version-win-x64-portable.zip" "dist/SHA256SUMS.txt" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "经典艾莉丝 $version" --notes-file $notes --latest
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publication failed." }
